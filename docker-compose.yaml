services:
  mysql:
    image: mysql:8.0
    container_name: mysql_container
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: myapp
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  apache:
    image: php:8.1-apache
    container_name: apache_container
    ports:
      - "80:80"
    volumes:
      - ./html:/var/www/html
    networks:
      - app_network
    depends_on:
      mysql:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin_container
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: rootpass123
      PMA_PORT: 3306
    ports:
      - "8080:80"
    networks:
      - app_network
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:

networks:
  app_network:
    driver: bridge
